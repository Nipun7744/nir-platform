services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nir_password}
      POSTGRES_DB: ${POSTGRES_DB:-nir}
    volumes:
      - ${POSTGRES_DATA_SOURCE:-postgres_data}:/var/lib/postgresql/data
    #ports:
    #  - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nir}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nir}:${POSTGRES_PASSWORD:-nir_password}@postgres:5432/${POSTGRES_DB:-nir}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PORT: 4000
      #CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: uploads
      # Proxy hops in front of the API (Cloudflare/nginx) — for real client IPs in rate limits + CAPTCHA.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Login CAPTCHA + registration OTP. Empty = unset, which is a startup ERROR here
      # (NODE_ENV=production) for CAPTCHA_PROVIDER / MAIL_TRANSPORT / SMS_PROVIDER — see docs/SETUP.md.
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      OTP_CHANNELS: ${OTP_CHANNELS:-EMAIL,SMS}
      OTP_SECRET: ${OTP_SECRET:-}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-}
      OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_TELETALK_USER: ${SMS_TELETALK_USER:-}
      SMS_TELETALK_USER_ID: ${SMS_TELETALK_USER_ID:-}
      SMS_TELETALK_PASSWORD: ${SMS_TELETALK_PASSWORD:-}
      SMS_TELETALK_URL: ${SMS_TELETALK_URL:-}
      SMS_TELETALK_SERVERNAME: ${SMS_TELETALK_SERVERNAME:-}
      SMS_TELETALK_SMS_CLASS: ${SMS_TELETALK_SMS_CLASS:-}
      SMS_TELETALK_SMS_ID: ${SMS_TELETALK_SMS_ID:-}
      SMS_TELETALK_CHARSET: ${SMS_TELETALK_CHARSET:-}
      SMS_TELETALK_VALIDITY: ${SMS_TELETALK_VALIDITY:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      SMS_HTTP_CONTENT_TYPE: ${SMS_HTTP_CONTENT_TYPE:-}
      SMS_HTTP_HEADERS: ${SMS_HTTP_HEADERS:-}
      SMS_HTTP_SUCCESS_PATTERN: ${SMS_HTTP_SUCCESS_PATTERN:-}
    volumes:
      - ${UPLOADS_DATA_SOURCE:-api_uploads}:/repo/apps/api/uploads
    ports:
      #- '127.0.0.1:4000:4000'
      - '${NIR_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      #- '127.0.0.1:3000:3000'
      - '${NIR_BIND_IP:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'

volumes:
  postgres_data:
  api_uploads:
