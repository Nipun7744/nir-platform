services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nir_password}
      POSTGRES_DB: ${POSTGRES_DB:-nir}
    volumes:
      - ${POSTGRES_DATA_SOURCE:-postgres_data}:/var/lib/postgresql/data
    #ports:
    #  - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nir}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nir}:${POSTGRES_PASSWORD:-nir_password}@postgres:5432/${POSTGRES_DB:-nir}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PORT: 4000
      #CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: uploads
    volumes:
      - ${UPLOADS_DATA_SOURCE:-api_uploads}:/repo/apps/api/uploads
    ports:
      #- '127.0.0.1:4000:4000'
      - '${NIR_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-4000}:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      #- '127.0.0.1:3000:3000'
      - '${NIR_BIND_IP:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'

volumes:
  postgres_data:
  api_uploads:
